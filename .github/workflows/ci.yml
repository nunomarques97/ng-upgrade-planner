name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Keep the run steps below in the same order as the "ci" script in package.json.
      - run: npm ci
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pack
